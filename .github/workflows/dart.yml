name: Dart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Python doctor regression tests
        run: python3 -m unittest discover -s test/python -p 'test_*.py'

      - name: Run Flutter tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo "No Flutter test files found. Skipping Flutter tests."
          fi
