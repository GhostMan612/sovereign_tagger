name: Android native build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, android-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          java -version
          flutter doctor -v
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compile Kotlin, C++, Chaquopy and Flutter into debug APK
        run: flutter build apk --debug --no-pub --target-platform ${{ matrix.target }}
      - name: Verify unsigned release fails closed
        shell: bash
        run: |
          set -euo pipefail
          if (cd android && ./gradlew :app:assembleRelease --no-daemon > /tmp/release-guard.log 2>&1); then
            echo "ERROR: release build passed without configured signing identity"
            exit 1
          fi
          if ! grep -Fq 'Release signing is not configured.' /tmp/release-guard.log; then
            echo "ERROR: release build failed for another reason, not signing enforcement"
            tail -100 /tmp/release-guard.log
            exit 1
          fi
          echo "Confirmed: release fails explicitly without signing credentials"
      - name: Inspect packaged ABI and native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -Z1 "$apk" | grep '^lib/${{ matrix.target == 'android-arm64' && 'arm64-v8a' || 'x86_64' }}/' > /tmp/abi-libraries.txt
          test -s /tmp/abi-libraries.txt
          echo 'Packaged native libraries:'
          cat /tmp/abi-libraries.txt
          echo "SHA256: $(sha256sum "$apk")"
          du -h "$apk"
      - name: Verify source-to-APK provenance
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find build -name build_manifest.json -path '*sovereign_provenance*' | head -1)"
          test -n "$manifest" || { echo "ERROR: missing build manifest"; exit 1; }
          manifest_dir="$(dirname "$manifest")"
          head="$(git rev-parse HEAD)"
          manifest_sha="$(python3 -c "import json;print(json.load(open('$manifest'))['sourceSha'])")"
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          test -n "$apk" || { echo "ERROR: no APK produced to digest"; exit 1; }
          digest_file="$manifest_dir/$(basename "$apk").sha256"
          test -s "$digest_file" || { echo "ERROR: missing APK digest $digest_file"; exit 1; }
          recorded="$(cut -d' ' -f1 "$digest_file")"
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "HEAD         : $head"
          echo "manifest sha : $manifest_sha"
          echo "apk          : $(basename "$apk")"
          echo "recorded sha : $recorded"
          echo "actual sha   : $actual"
          [ "$head" = "$manifest_sha" ] || { echo "ERROR: manifest SHA does not match the checkout"; exit 1; }
          [ "$recorded" = "$actual" ] || { echo "ERROR: recorded APK digest does not match the artifact"; exit 1; }
          echo "Provenance verified: $(basename "$apk") is traceable to commit $head"
      - name: Upload APK for device verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-tagger-${{ matrix.target }}-debug
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/**/sovereign_provenance/
          retention-days: 7
