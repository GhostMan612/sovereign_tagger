// build.gradle

// ============================================================
// As Above, So Below. As Within, So Without.
// The Future Dictates the Past and the Past is Always Present.
// ============================================================

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def releaseKeystorePath = System.getenv("SOVEREIGN_KEYSTORE") ?: localProperties.getProperty("sovereign.keystore")
def releaseStorePassword = System.getenv("SOVEREIGN_STORE_PASSWORD") ?: localProperties.getProperty("sovereign.storePassword")
def releaseKeyAlias = System.getenv("SOVEREIGN_KEY_ALIAS") ?: localProperties.getProperty("sovereign.keyAlias")
def releaseKeyPassword = System.getenv("SOVEREIGN_KEY_PASSWORD") ?: localProperties.getProperty("sovereign.keyPassword")
def releaseSigningReady = releaseKeystorePath != null &&
    file(releaseKeystorePath).isFile() &&
    [releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }

// --- Sovereign source-to-APK provenance -----------------------------------------
// The source identity is resolved from the actual checkout at configuration
// time. The build refuses to run without it, so an installed build can always
// be traced back to the commit that produced it.
def sovereignRepoRoot = new File(rootProject.projectDir, "..").canonicalFile

def sovereignGit = { String... gitArgs ->
    providers.exec {
        executable "git"
        args(["-C", sovereignRepoRoot.absolutePath] + gitArgs.toList())
    }.standardOutput.asText.map { it.trim() }
}

def sovereignSourceSha
try {
    sovereignSourceSha = sovereignGit("rev-parse", "HEAD").get()
} catch (Exception ex) {
    throw new GradleException(
        "Sovereign provenance: could not resolve the source commit SHA from " +
        "${sovereignRepoRoot.absolutePath} (${ex.message}). " +
        "Refusing to build an untraceable APK."
    )
}
if (sovereignSourceSha.isEmpty()) {
    throw new GradleException(
        "Sovereign provenance: could not resolve the source commit SHA from " +
        "${sovereignRepoRoot.absolutePath}. Refusing to build an untraceable APK."
    )
}
def sovereignSourceDirty = !sovereignGit(
    "status", "--porcelain", "--untracked-files=no"
).get().isEmpty()
def sovereignBuildAbis = "arm64-v8a,x86_64"
def sovereignBuiltAt = new Date().format(
    "yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC")
)

android {
    namespace = "com.sovereigntagger"

    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId = "com.sovereigntagger"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        buildConfigField "String", "SOURCE_SHA", "\"${sovereignSourceSha}\""
        buildConfigField "boolean", "SOURCE_DIRTY", "${sovereignSourceDirty}"
        buildConfigField "String", "BUILD_ABIS", "\"${sovereignBuildAbis}\""
        buildConfigField "String", "BUILD_TIME_UTC", "\"${sovereignBuiltAt}\""

        ndk {
            // 64-bit only drops armeabi-v7a ~30% APK bloat; minSdk 26 = 99% of active devices 64-bit. Re-add "armeabi-v7a" only if Moto G 32-bit support required.
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        python {
            // Chaquopy LTS is 3.11; 3.14 is bleeding edge and will fail if chaquopy plugin <15.x. If Gradle sync fails with "Python 3.14 not found", change to "3.11".
            version "3.14"
            pip {
                install "yt-dlp==2026.10.26"
                install "mutagen==1.48.1"
                install "lyricsgenius==3.15.0"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseSigningReady ? signingConfigs.release : null
            // R8 runs on release (it does NOT run on debug), so without these rules
            // `flutter build apk --release` fails on jaudiotagger's desktop-Java
            // references. See android/app/proguard-rules.pro for the full story.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Resource shrinking is OFF deliberately. audio_service resolves its
            // notification icons by NAME at runtime (AudioService.java:419 ->
            // Resources.getIdentifier), which the resource shrinker cannot see as a
            // reference. Shrinking therefore DELETED audio_service_play_arrow /
            // _pause / _skip_next / _skip_previous / _stop / _fast_forward /
            // _fast_rewind, and every MediaSession update then threw
            //   IllegalArgumentException: You must specify an icon resource id
            //   to build a CustomAction
            // which broke the lockscreen notification buttons. See
            // res/raw/keep.xml for the belt-and-braces keep list. Cost of leaving
            // shrinking off is negligible here (the APK is ~487MB, dominated by
            // FFmpeg + Python + the 141MB Whisper model, not by resources).
            shrinkResources false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "SovereignTagger.apk"
        }
    }
}

// Built-in Kotlin (AGP 9+): the Kotlin Gradle Plugin and kotlinOptions are gone.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { task ->
        task.project.path == ':app' &&
            task.name.endsWith('Release') &&
            (task.name.startsWith('assemble') ||
             task.name.startsWith('bundle') ||
             task.name.startsWith('package') ||
             task.name.startsWith('validateSigning'))
    }
    if (wantsRelease && !releaseSigningReady) {
        throw new GradleException(
            "Release signing is not configured. Set SOVEREIGN_KEYSTORE, " +
            "SOVEREIGN_STORE_PASSWORD, SOVEREIGN_KEY_ALIAS and SOVEREIGN_KEY_PASSWORD. " +
            "Use assembleDebug for an explicitly debug-signed build."
        )
    }
}

flutter {
    source = "../.."
}

// --- Sovereign provenance outputs ------------------------------------------------
// The manifest lives outside the APK so it can carry the artifact digest, which
// by definition cannot be embedded inside the artifact it describes.
def sovereignManifestDir = layout.buildDirectory.dir("sovereign_provenance")
def sovereignApkDir = rootProject.layout.buildDirectory
    .dir("app/outputs/flutter-apk").get().asFile

def writeSovereignManifest = tasks.register("writeSovereignBuildManifest") {
    doLast {
        // Development builds may be dirty; release artifacts may not — a commit
        // SHA alone cannot identify an APK built with uncommitted changes.
        def buildingRelease = gradle.taskGraph.allTasks.any { task ->
            task.name.toLowerCase().contains("release")
        }
        if (buildingRelease && sovereignSourceDirty) {
            throw new GradleException(
                "Sovereign provenance: release artifacts require a clean checkout. " +
                "Commit or stash the pending changes before building a release."
            )
        }
        def outDir = sovereignManifestDir.get().asFile
        outDir.mkdirs()
        def manifest = [
            schema      : 1,
            sourceSha   : sovereignSourceSha,
            sourceDirty : sovereignSourceDirty,
            release     : buildingRelease,
            versionCode : flutterVersionCode.toInteger(),
            versionName : flutterVersionName,
            abis        : ["arm64-v8a", "x86_64"],
            gradle      : gradle.gradleVersion,
            builtAtUtc : sovereignBuiltAt,
        ]
        new File(outDir, "build_manifest.json").text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
        println "Sovereign provenance: source ${sovereignSourceSha} -> ${outDir}"
    }
}

def recordSovereignApkDigest = tasks.register("recordSovereignApkDigest") {
    doLast {
        // Runs after packaging, so the digest describes the signed artifact that
        // actually ships — not an intermediate. CI recomputes it from the file it
        // uploads, which catches any post-packaging modification.
        def apks = (sovereignApkDir.listFiles() ?: []).findAll { it.name.endsWith(".apk") }
        if (apks.isEmpty()) {
            throw new GradleException(
                "Sovereign provenance: no APK found in ${sovereignApkDir} to digest."
            )
        }
        def outDir = sovereignManifestDir.get().asFile
        outDir.mkdirs()
        apks.each { apk ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            apk.withInputStream { stream ->
                def buffer = new byte[64 * 1024]
                int read
                while ((read = stream.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            def hex = digest.digest().collect { String.format("%02x", it) }.join()
            new File(outDir, "${apk.name}.sha256").text = "${hex}  ${apk.name}\n"
            println "Sovereign provenance: ${apk.name} sha256=${hex}"
        }
    }
}

// The manifest runs before the build so a dirty release checkout fails early;
// the digest runs after packaging so it describes the shipped artifact.
tasks.matching { it.name == "preBuild" }.configureEach { preBuildTask ->
    preBuildTask.dependsOn writeSovereignManifest
}

tasks.matching { it.name.startsWith("assemble") }.configureEach { assembleTask ->
    assembleTask.finalizedBy recordSovereignApkDigest
}

dependencies {
    implementation fileTree(dir: "${project.projectDir}/libs", include: ['*.jar'])
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    testImplementation 'junit:junit:4.13.2'
}
