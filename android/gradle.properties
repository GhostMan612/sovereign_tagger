org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# THIS IS THE FIX: Disables Flutter's default ABI injection 
# so it respects our 64-bit restriction and stops requesting armeabi-v7a.
disable-abi-filtering=true
# Built-in Kotlin (AGP 9+): the app and every plugin use AGP's built-in Kotlin
# compiler, so no Kotlin Gradle Plugin is declared or applied anywhere.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
